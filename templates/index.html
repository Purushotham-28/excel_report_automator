<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Excel Report Automator | Intelligent Data Engine</title>
  
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --table-header-bg: #1e293b;
      --table-alt-bg: rgba(255, 255, 255, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #root {
      width: 100%;
      max-width: 1200px;
    }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      padding: 2rem;
      margin-bottom: 2rem;
      transition: all 0.3s ease;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 8px 16px rgba(56, 189, 248, 0.25);
    }
    .brand-text h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(to right, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-text p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Upload Zone */
    .upload-zone {
      border: 2px dashed rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      background: rgba(15, 23, 42, 0.4);
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.05);
      transform: translateY(-2px);
    }
    .upload-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      background: rgba(56, 189, 248, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }
    .file-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: white;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-success {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .btn-success:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stat-val {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .stat-lbl {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Data Tables */
    .tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      padding: 0.75rem 1.25rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      max-height: 480px;
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      text-align: left;
    }
    th {
      background: var(--table-header-bg);
      color: #93c5fd;
      padding: 0.85rem 1rem;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    tr:nth-child(even) {
      background: var(--table-alt-bg);
    }
    .badge-error {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      background: var(--error-bg);
      color: #fca5a5;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--card-border);
    }

    .spinner {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [file, setFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");
      const [reportData, setReportData] = useState(null);
      const [activeTab, setActiveTab] = useState("cleaned");

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files[0]) {
          setFile(e.target.files[0]);
          setErrorMsg("");
        }
      };

      const handleProcessFile = async (fileToUpload) => {
        const targetFile = fileToUpload || file;
        if (!targetFile) {
          setErrorMsg("Please select a CSV or Excel file to process.");
          return;
        }

        setLoading(true);
        setErrorMsg("");

        const formData = new FormData();
        formData.append("file", targetFile);

        try {
          const res = await fetch("/api/process", {
            method: "POST",
            body: formData
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || "Failed to process file.");
          }

          setReportData(data);
          setActiveTab("cleaned");
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleDownload = () => {
        if (reportData && reportData.report_filename) {
          window.location.href = `/api/download/${reportData.report_filename}`;
        }
      };

      const handleLoadSample = async () => {
        setLoading(true);
        setErrorMsg("");
        try {
          const sampleCsvText = `Transaction ID,Date,Category,Product Name,Quantity,Unit Price,Total Amount,Region
TXN1001,2026-01-05,Electronics,Wireless Mouse,2,25.50,51.00,North
TXN1002,2026-01-06,Office Supplies,Ergonomic Chair,1,150.00,150.00,South
TXN1003,2026-01-06,Electronics,USB-C Cable,-3,12.00,-36.00,East
TXN1004,2026-01-07,Furniture,Standing Desk,1,450.00,450.00,West
TXN1005,2026-01-08,Electronics,Bluetooth Headset,2,85.00,170.00,North
TXN1001,2026-01-05,Electronics,Wireless Mouse,2,25.50,51.00,North
TXN1006,2026-01-09,,Desk Lamp,3,29.99,89.97,South
TXN1007,2026-01-10,Furniture,Bookshelf,2,-75.00,-150.00,East
TXN1008,2026-01-11,Office Supplies,Mechanical Keyboard,1,95.00,95.00,West
TXN1009,2026-01-12,Electronics,4K Monitor,1,350.00,350.00,North
TXN1010,2026-01-13,Office Supplies,Gel Pens (Pack of 10),5,15.00,75.00,
TXN1011,2026-01-14,Furniture,Office Chair,2,120.00,240.00,South
TXN1012,2026-01-15,Electronics,Laptop Stand,4,30.00,120.00,East
TXN1004,2026-01-07,Furniture,Standing Desk,1,450.00,450.00,West
TXN1013,2026-01-16,Office Supplies,Paper Reams,10,8.50,85.00,West
TXN1014,2026-01-17,Electronics,Webcam HD,,60.00,0.00,North
TXN1015,2026-01-18,Furniture,Filing Cabinet,1,210.00,210.00,South
TXN1016,2026-01-19,Office Supplies,Stapler Heavy Duty,2,-15.00,-30.00,East
TXN1017,2026-01-20,Electronics,USB Hub,3,22.00,66.00,West
TXN1018,2026-01-21,Furniture,Monitor Arm,2,80.00,160.00,North`;

          const blob = new Blob([sampleCsvText], { type: "text/csv" });
          const sampleFile = new File([blob], "sample_input.csv", { type: "text/csv" });
          setFile(sampleFile);
          await handleProcessFile(sampleFile);
        } catch (err) {
          setErrorMsg("Failed to load sample data: " + err.message);
          setLoading(false);
        }
      };

      return (
        <div>
          {/* Header */}
          <header className="header glass-panel">
            <div className="brand">
              <div className="brand-icon">
                <i data-lucide="file-spreadsheet"></i>
              </div>
              <div className="brand-text">
                <h1>Excel Report Automator</h1>
                <p>Intelligent Data Cleaning, Validation & Reporting Engine</p>
              </div>
            </div>
            <div className="status-badge">
              <i data-lucide="sparkles" style={{width: 16, height: 16}}></i>
              Engine Active
            </div>
          </header>

          {/* Upload Card */}
          <div className="glass-panel">
            <div className="upload-zone">
              <input 
                type="file" 
                className="file-input" 
                accept=".csv, .xlsx, .xls"
                onChange={handleFileChange}
              />
              <div className="upload-icon">
                <i data-lucide="upload-cloud" style={{width: 32, height: 32}}></i>
              </div>
              <h3>{file ? file.name : "Click or Drag & Drop File Here"}</h3>
              <p style={{color: "var(--text-muted)", fontSize: "0.875rem", marginTop: 4}}>
                {file ? `${(file.size / 1024).toFixed(1)} KB` : "Supports CSV, XLSX, and XLS datasets"}
              </p>
            </div>

            {errorMsg && (
              <div style={{
                marginTop: "1rem", 
                padding: "0.85rem 1rem", 
                background: "var(--error-bg)", 
                border: "1px solid var(--error)",
                borderRadius: "8px",
                color: "#fca5a5",
                fontSize: "0.9rem",
                display: "flex",
                alignItems: "center",
                gap: "0.5rem"
              }}>
                <i data-lucide="alert-triangle" style={{width: 18, height: 18}}></i>
                {errorMsg}
              </div>
            )}

            <div style={{display: "flex", gap: "1rem", marginTop: "1.5rem", justifyContent: "flex-end"}}>
              <button className="btn btn-secondary" onClick={handleLoadSample} disabled={loading}>
                <i data-lucide="play" style={{width: 16, height: 16}}></i>
                Test Sample Dataset
              </button>
              <button className="btn btn-primary" onClick={() => handleProcessFile(file)} disabled={loading || !file}>
                {loading ? (
                  <>
                    <i data-lucide="loader-2" className="spinner" style={{width: 18, height: 18}}></i>
                    Processing Data...
                  </>
                ) : (
                  <>
                    <i data-lucide="zap" style={{width: 18, height: 18}}></i>
                    Run Automator Engine
                  </>
                )}
              </button>
            </div>
          </div>

          {/* Results Section */}
          {reportData && (
            <div className="glass-panel">
              <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "1.5rem"}}>
                <div>
                  <h2 style={{fontSize: "1.25rem", fontWeight: 700}}>Dataset Analysis & Report</h2>
                  <p style={{color: "var(--text-muted)", fontSize: "0.85rem"}}>File: {reportData.filename}</p>
                </div>
                <button className="btn btn-success" onClick={handleDownload}>
                  <i data-lucide="download" style={{width: 18, height: 18}}></i>
                  Download Excel Report (.xlsx)
                </button>
              </div>

              {/* Stats Cards */}
              <div className="stats-grid">
                <div className="stat-card">
                  <div className="stat-icon" style={{background: "rgba(56, 189, 248, 0.15)", color: "#38bdf8"}}>
                    <i data-lucide="database" style={{width: 22, height: 22}}></i>
                  </div>
                  <div>
                    <div className="stat-val">{reportData.stats.total_raw_rows}</div>
                    <div className="stat-lbl">Total Input Rows</div>
                  </div>
                </div>

                <div className="stat-card">
                  <div className="stat-icon" style={{background: "rgba(245, 158, 11, 0.15)", color: "#f59e0b"}}>
                    <i data-lucide="copy-x" style={{width: 22, height: 22}}></i>
                  </div>
                  <div>
                    <div className="stat-val">{reportData.stats.duplicate_rows_count}</div>
                    <div className="stat-lbl">Duplicates Removed</div>
                  </div>
                </div>

                <div className="stat-card">
                  <div className="stat-icon" style={{background: "rgba(16, 185, 129, 0.15)", color: "#10b981"}}>
                    <i data-lucide="check-circle-2" style={{width: 22, height: 22}}></i>
                  </div>
                  <div>
                    <div className="stat-val">{reportData.stats.cleaned_rows_count}</div>
                    <div className="stat-lbl">Valid Cleaned Rows</div>
                  </div>
                </div>

                <div className="stat-card">
                  <div className="stat-icon" style={{background: "rgba(239, 68, 68, 0.15)", color: "#ef4444"}}>
                    <i data-lucide="alert-octagon" style={{width: 22, height: 22}}></i>
                  </div>
                  <div>
                    <div className="stat-val">{reportData.stats.error_rows_count}</div>
                    <div className="stat-lbl">Flagged Errors</div>
                  </div>
                </div>
              </div>

              {/* Data Preview Tabs */}
              <div className="tabs">
                <button 
                  className={`tab-btn ${activeTab === 'cleaned' ? 'active' : ''}`}
                  onClick={() => setActiveTab('cleaned')}
                >
                  Cleaned Data ({reportData.cleaned_data.length})
                </button>
                <button 
                  className={`tab-btn ${activeTab === 'errors' ? 'active' : ''}`}
                  onClick={() => setActiveTab('errors')}
                >
                  Flagged Errors ({reportData.errors_data.length})
                </button>
                <button 
                  className={`tab-btn ${activeTab === 'summary' ? 'active' : ''}`}
                  onClick={() => setActiveTab('summary')}
                >
                  Executive Summary
                </button>
              </div>

              {/* Tab Contents */}
              {activeTab === 'cleaned' && (
                <div className="table-container">
                  <table>
                    <thead>
                      <tr>
                        {reportData.columns.map((col, i) => (
                          <th key={i}>{col}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {reportData.cleaned_data.map((row, rIdx) => (
                        <tr key={rIdx}>
                          {reportData.columns.map((col, cIdx) => (
                            <td key={cIdx}>{row[col]}</td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {activeTab === 'errors' && (
                <div className="table-container">
                  <table>
                    <thead>
                      <tr>
                        {reportData.error_columns.map((col, i) => (
                          <th key={i}>{col}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {reportData.errors_data.map((row, rIdx) => (
                        <tr key={rIdx}>
                          {reportData.error_columns.map((col, cIdx) => (
                            <td key={cIdx}>
                              {col === 'error_reason' ? (
                                <span className="badge-error">{row[col]}</span>
                              ) : (
                                row[col]
                              )}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {activeTab === 'summary' && (
                <div>
                  <h4 style={{marginBottom: "0.75rem", color: "#93c5fd"}}>Category Summary Table</h4>
                  <div className="table-container">
                    <table>
                      <thead>
                        <tr>
                          {reportData.category_summary_data.length > 0 && 
                            Object.keys(reportData.category_summary_data[0]).map((k, i) => (
                              <th key={i}>{k}</th>
                            ))
                          }
                        </tr>
                      </thead>
                      <tbody>
                        {reportData.category_summary_data.map((row, rIdx) => {
                          const isTotal = row.Category === "Grand Total";
                          return (
                            <tr key={rIdx} style={isTotal ? {fontWeight: "700", background: "rgba(56, 189, 248, 0.1)"} : {}}>
                              {Object.keys(row).map((k, cIdx) => (
                                <td key={cIdx}>
                                  {typeof row[k] === 'number' && !Number.isInteger(row[k])
                                    ? row[k].toFixed(2)
                                    : row[k]}
                                </td>
                              ))}
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
